<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>المترجم الفوري الذكي | المحادثة والكاميرا</title>
    
    <!-- مكتبة التصميم الاحترافي Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- إعداد خطوط وتصاميم مريحة للعين -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f4f8',
                100: '#dbeafe',
                600: '#1e40af',
                700: '#1d4ed8',
                900: '#1e3a8a',
              }
            }
          }
        }
      }
    </script>

    <!-- مكتبة الأيقونات Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      /* تأثير الحركة لأمواج الصوت */
      .voice-wave {
        animation: quiet 1.2s ease-in-out infinite alternate;
      }
      @keyframes quiet {
        0% { transform: scaleY(0.4); }
        100% { transform: scaleY(1.2); }
      }
    </style>
  </head>
  <body className="bg-slate-950 text-slate-100 overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
